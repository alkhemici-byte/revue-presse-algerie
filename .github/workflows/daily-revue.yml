yaml
name: Daily Revue de Presse

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - name: Generate revue
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: node generate-revue.js
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: reports
          path: reports/