yaml
name: Daily Revue de Presse

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Generate and send revue
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: node generate-revue.js
      
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: revue-presse-reports
          path: reports/
          retention-days: 30